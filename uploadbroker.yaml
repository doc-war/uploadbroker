# 监听本地 8880 端口
listen: 127.0.0.1:8880
# 基础 URL，用于拼接生成可公开访问的资源链接
base_url: https://uploadbroker.dow-war.com
# 用于生成 URL 签名的盐值列表，可以增加安全性
url_blake2b_salts:
  - doc-war.com/uploadbroker

# 资源 URL 的前缀，默认是 'tmp'
url_prefix: tmp

# 元数据存储的数据库文件路径
metadata_db: ./data/broker.db

# 后台清理过期文件的执行间隔
cleanup_interval: 10m

# 文件的默认生存时间 (TTL)
default_ttl: 2h

# 不同文件类型的上传大小限制
limits:
  image: 2MB
  audio: 3MB
  video: 10MB
  document: 2MB

# 存储相关的配置
storage:
  # 指定用于上传的存储驱动为本地纯粹
  upload_driver: local
  drivers:
    local:
      provider: local
      root: ./data/objects    # 本地存储的根目录
